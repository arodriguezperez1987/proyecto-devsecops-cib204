name: Pipeline DevSecOps CIB-204

# Se ejecuta en cada push y en cada pull request a main, y a mano desde Actions.
on:
  push:
    branches: ["main", "inseguro", "solucion"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Permisos minimos; el job de CodeQL necesita escribir eventos de seguridad.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1) SAST con Semgrep  ->  detecta eval(), inyeccion SQL/comandos, JWT, CORS
  # ==========================================================================
 
  sast_semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ejecutar Semgrep 
        run: |
          semgrep scan \
            --config p/default \
            --config p/javascript \
            --config p/nodejs \
            --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
            --error \
            --sarif \
            --output semgrep.sarif .
      - name: Guardar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporte-semgrep
          path: semgrep.sarif

  # ==========================================================================
  # 2) SAST con CodeQL  ->  motor de analisis de GitHub para JavaScript
  #    NOTA: en repositorios PRIVADOS, el escaneo de codigo (CodeQL) requiere
  #    GitHub Advanced Security. Con el plan gratuito, haz el repo PUBLICO
  #    para este laboratorio, o apoyate en Semgrep como SAST principal.
  # ==========================================================================
  sast_codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67
        with:
          languages: javascript
          queries: security-extended
      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67

  # ==========================================================================
  # 3) Deteccion de secretos con Gitleaks  ->  .env, llave privada, claves AWS
  # ==========================================================================
  secretos:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git -v \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Guardar reporte Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporte-gitleaks
          path: gitleaks.sarif

  # ==========================================================================
  # 4) SCA - Analisis de dependencias  ->  npm audit + Trivy (sistema de archivos)
  # ==========================================================================
  sca:
    name: SCA - Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: npm audit (falla en severidad alta o critica)
        working-directory: servidor
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high
      - name: Trivy - dependencias (fs)
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          scan-type: fs
          scan-ref: servidor
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # ==========================================================================
  # 5) Seguridad de la imagen  ->  Trivy (imagen) + SBOM con Syft
  # ==========================================================================
  imagen:
    name: Imagen - Trivy + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Construir la imagen
        run: docker build -t cifrado:${{ github.sha }} ./servidor
      - name: Trivy - escaneo de imagen
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          scan-type: image
          image-ref: cifrado:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
      - name: Generar SBOM (Syft)
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: cifrado:${{ github.sha }}
          output-file: sbom.spdx.json
      - name: Guardar SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.spdx.json

  # ==========================================================================
  # 6) DAST - OWASP ZAP  ->  ataca la app en ejecucion (cabeceras, CORS, etc.)
  # ==========================================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Levantar el servicio
        run: |
          docker build -t cifrado ./servidor
          docker run -d -p 3000:3000 --name cifrado cifrado
          sleep 8
          curl -s http://localhost:3000/salud || true
      - name: OWASP ZAP Baseline (genera el informe)
        run: |
          mkdir -p "$PWD/zap" && chmod 777 "$PWD/zap"
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r informe_zap.html -a -I || true
      - name: Guardar informe ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporte-zap
          path: zap/informe_zap.html
